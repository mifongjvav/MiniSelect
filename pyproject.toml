[project]
name = "miniselect"
version = "0.3.0"
description = "A GTK4 floating menu application using native widgets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Argon", email = "mifongjvav@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.3",
    "PyGObject>=3.50.0",
]

[project.urls]
Homepage = "https://github.com/mifongjvav/MiniSelect"
Repository = "https://github.com/mifongjvav/MiniSelect"

[project.scripts]
miniselect = "miniselect.cli:main"
miniselect-gtk = "miniselect.gtk.app:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# 显式固定规则集，避免 ruff 默认值随版本变化导致本地与 CI 结果不一致。
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
# PyGObject 要求先调用 gi.require_version() 再 import gi.repository，必然触发 E402。
"src/miniselect/gtk/*.py" = ["E402"]

